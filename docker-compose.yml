# Run the whole app with one command:  docker compose up --build
# Then open http://localhost:8081 (API docs at http://localhost:8000/docs).
# Settings: the API reads backend.env; the web container reads frontend.env at start-up
# (it writes /config.js from it), so editing those two files and re-running the command is enough.
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:8081
    volumes:
      - laluan-db:/app/var

  web:
    build: ./frontend
    ports:
      - "8081:80"
    env_file:
      - path: ./frontend.env
        required: false
    depends_on:
      - api

volumes:
  laluan-db:
