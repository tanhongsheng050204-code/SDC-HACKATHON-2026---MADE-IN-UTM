# Render blueprint for the API. New > Blueprint on render.com, pick this repository.
# The frontend is hosted on Vercel and calls this service through VITE_API_URL.
# One instance only: the trend and evidence refresh jobs run inside the server process (DECISIONS #38).
# Secrets marked "sync: false" are entered in the Render dashboard, never committed (README "Deployment").
services:
  - type: web
    name: laluan-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://laluan-psi.vercel.app,http://localhost:5173
      # Every other address Vercel gives this project (per-deploy and team URLs).
      - key: CORS_ORIGIN_REGEX
        value: https://laluan(-[a-z0-9]+)*\.vercel\.app
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL  # Supabase Session pooler URI
        sync: false
      - key: SUPABASE_URL
        value: https://cxzcyumodnhjvlutvzyn.supabase.co
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNPOD_LLM_ENDPOINT
        sync: false
      - key: RUNPOD_WHISPER_ENDPOINT
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: SENTRY_DSN  # optional error tracking
        sync: false
      # Email (weekly digest and job alerts) through a team Gmail with an app password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD  # a Gmail app password, not the account password
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CRON_SECRET  # same value as the GitHub repository secret CRON_SECRET
        sync: false
      - key: APP_URL
        value: https://laluan-psi.vercel.app
      - key: PUBLIC_API_URL
        value: https://laluan-api.onrender.com
